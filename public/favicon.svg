<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Зелёный фон -->
  <rect width="64" height="64" rx="14" fill="#2d6a2d"/>

  <!-- Круглая рамка -->
  <circle cx="32" cy="35" r="21" fill="#1a4d1a" stroke="#c8a84b" stroke-width="2.5"/>

  <!-- Колос слева -->
  <ellipse cx="13" cy="27" rx="3" ry="8" fill="#c8a84b" transform="rotate(-22 13 27)"/>
  <ellipse cx="10" cy="30" rx="2" ry="6" fill="#c8a84b" transform="rotate(-35 10 30)"/>

  <!-- Колос справа -->
  <ellipse cx="51" cy="27" rx="3" ry="8" fill="#c8a84b" transform="rotate(22 51 27)"/>
  <ellipse cx="54" cy="30" rx="2" ry="6" fill="#c8a84b" transform="rotate(35 54 30)"/>

  <!-- Голова фермера -->
  <circle cx="32" cy="24" r="4" fill="#e8c88a"/>
  <!-- Шляпа поля -->
  <ellipse cx="32" cy="21.5" rx="6.5" ry="1.8" fill="#b8922a"/>
  <!-- Тулья шляпы -->
  <rect x="29" y="17" width="6" height="5" rx="1.5" fill="#b8922a"/>

  <!-- Тело (нагнувшийся) -->
  <rect x="29.5" y="28" width="5" height="7" rx="1" fill="#4a7fc1"/>

  <!-- Руки тянутся вниз -->
  <line x1="29.5" y1="30" x2="24" y2="38" stroke="#e8c88a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34.5" y1="30" x2="40" y2="38" stroke="#e8c88a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Ноги -->
  <line x1="31" y1="35" x2="29" y2="45" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="35" x2="35" y2="45" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Колоски поля снизу -->
  <ellipse cx="25" cy="43" rx="2" ry="5" fill="#c8a84b" transform="rotate(8 25 43)"/>
  <ellipse cx="32" cy="44" rx="2" ry="5" fill="#c8a84b"/>
  <ellipse cx="39" cy="43" rx="2" ry="5" fill="#c8a84b" transform="rotate(-8 39 43)"/>

  <!-- Надпись FILINI сверху -->
  <text x="32" y="12" font-size="7.5" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" fill="#c8a84b" letter-spacing="1.2">FILINI</text>
</svg>
